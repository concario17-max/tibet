<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Tibet favicon</title>
  <desc id="desc">A warm gold medallion with a sacred Tibetan mark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fbf7ef" />
      <stop offset="100%" stop-color="#ebe1cd" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6c7a2" />
      <stop offset="100%" stop-color="#8c6d45" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5f4524" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)" />
  <circle cx="64" cy="64" r="44" fill="#f8f1e4" stroke="url(#ring)" stroke-width="5" filter="url(#shadow)" />
  <circle cx="64" cy="64" r="34" fill="none" stroke="#d6c7a2" stroke-opacity="0.7" stroke-width="1.5" />
  <text
    x="64"
    y="74"
    text-anchor="middle"
    font-size="38"
    font-family="'Cormorant Garamond', 'Noto Serif', serif"
    fill="#7d5e35"
  >༄</text>
</svg>
